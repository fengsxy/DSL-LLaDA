max_steps: 10000
resume: null

# lm1b options
batch_size: 40  # 40 on h100
eval_batch_size: 64  # 84 on h100
grad_accum_steps: 1  # doesn't help on h100

num_workers: 4
pin_memory: true
drop_last: true
shuffle: true
mix_lambda: 0.  # lambda * NLL ROAR + (1-lambda) * CE
num_nodes: 1  # no multi-node for now

init_pretrained: true
pretrained_model: 'kuleshov-group/mdlm-owt'

ckpt:
  dir: ${hydra:run.dir}/checkpoints
  save_every: null       # set to 0 or null to disable periodic saves
  save_last: true
  save_best: false

val:
  enabled: true
  every: 200
  max_batches: 5     # optional cap on #val batches per eval (int or null)