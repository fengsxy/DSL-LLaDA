# configs/data/text8.yaml
train: text8
valid: text8
tokenizer_name_or_path: text8
streaming: false
cache_dir: ${hydra:runtime.cwd}/data_cache
block_size: 256
wrap: true
insert_train_eos: true  # BETWEEN wrapped examples. Outer ones always added.
insert_valid_eos: true

dim_embed: 16  # embed in this dimension, learn to noise and denoise, localization dynamics
# Best value is not clear - for random codes to be ~ortho suggests modest scaling for vocab,
#like d ~ 16 log |V| / log 35, if text8 has 35 vocab and works well with d=16
# If codewords are (or can be) ortho, then max SNR to reliably distinguish should go like log |V|