# w/o sentence packing, matching SEDD, https://github.com/s-sahoo/duo/blob/main/scripts/train_lm1b_duo.sh
train: lm1b
valid: lm1b
tokenizer_name_or_path: bert-base-uncased
cache_dir: ${hydra:runtime.cwd}/data_cache2  # different per dataset, I got errors if not
wrap: False
streaming: False
insert_train_eos: True
insert_valid_eos: True

block_size: 128  # or sequence length, if you prefer

dim_embed: 48  # embed in this dimension, learn to noise and denoise, localization dynamics
# Best value is not clear - for random codes to be ~ortho suggests modest scaling for vocab,
#like d ~ 16 log |V| / log 35, if text8 has 35 vocab and works well with d=16
# If codewords are (or can be) ortho, then the max SNR needed to reliably distinguish should go like log |V|